name: Android Slice A

on:
  push:
    branches: [main, "lab/**", "feat/**", "cursor/**"]
  pull_request:

concurrency:
  group: android-slice-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          set +o pipefail
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          set -o pipefail
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Unit tests and debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload Slice A debug APK
        uses: actions/upload-artifact@v4
        with:
          name: leasegrid-sync-android-slice-a-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
