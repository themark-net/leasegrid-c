name: AppImage

# Builds the Linux x86_64 AppImage (Sync + Tahoe 1.20 + Magic Folder 24.3) and
# proves it can join a friendnet with no Python on PATH. Uploaded as a workflow
# artifact on every run; attached to the GitHub Release on v* tags.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "packaging/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/appimage.yml"
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/appimage.yml"
  workflow_dispatch:

jobs:
  appimage:
    # Oldest LTS we still want the binary to run on decides the glibc floor.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-dev build-essential libfuse2 file \
            libxcb-xinerama0 libxkbcommon-x11-0 libegl1
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[sync,tahoe]" pyinstaller
      - name: Build AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: packaging/build-appimage.sh
      - name: Exit test — clean env joins a local friendnet
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          # Server side from the dev venv; the client side uses ONLY the AppImage.
          export LEASEGRID_DEVGRID_DIR=/tmp/ci-grid
          PATH="$PWD/.venv/bin:$PATH" scripts/dev-grid.sh > /tmp/ci-grid.out 2>&1 &
          for _ in $(seq 1 60); do grep -q "dev-grid up" /tmp/ci-grid.out && break; sleep 1; done
          grep -q "dev-grid up" /tmp/ci-grid.out || { cat /tmp/ci-grid.out; exit 1; }
          FURL="$(grep -o 'pb://[^ ]*' /tmp/ci-grid.out | head -1)"
          APP="$(ls dist/Leasegrid_Sync-*.AppImage)"
          mkdir -p /tmp/ci-home /tmp/ci-sync
          env -i HOME=/tmp/ci-home PATH=/usr/bin:/bin USER=ci QT_QPA_PLATFORM=offscreen \
            LEASEGRID_SYNC_HOME=/tmp/ci-home LEASEGRID_ISSUER_URL=http://127.0.0.1:8700 \
            "$APP" --appimage-extract-and-run --version
          env -i HOME=/tmp/ci-home PATH=/usr/bin:/bin USER=ci QT_QPA_PLATFORM=offscreen \
            LEASEGRID_SYNC_HOME=/tmp/ci-home LEASEGRID_ISSUER_URL=http://127.0.0.1:8700 \
            timeout 180 "$APP" --appimage-extract-and-run --join "$FURL" | tee /tmp/ci-join.out
          grep -q "^Connected" /tmp/ci-join.out
          env -i HOME=/tmp/ci-home PATH=/usr/bin:/bin USER=ci QT_QPA_PLATFORM=offscreen \
            LEASEGRID_SYNC_HOME=/tmp/ci-home LEASEGRID_ISSUER_URL=http://127.0.0.1:8700 \
            timeout 240 "$APP" --appimage-extract-and-run --dogfood-folder /tmp/ci-sync --credit-dogfood --credit-tier small
          grep -q "leasegrid-sync" /tmp/ci-home/logs/tahoe.log  # bundled tahoe, not a system one
      - uses: actions/upload-artifact@v4
        with:
          name: Leasegrid_Sync-x86_64.AppImage
          path: dist/Leasegrid_Sync-*.AppImage
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Leasegrid_Sync-*.AppImage
          generate_release_notes: true
