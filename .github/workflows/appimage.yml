name: AppImage

# Builds the Linux x86_64 AppImage (Sync + Tahoe 1.20 + Magic Folder 24.3) and
# proves it can join a friendnet with no Python on PATH. Uploaded as a workflow
# artifact on every run; attached to the GitHub Release on v* tags.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "packaging/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/appimage.yml"
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/appimage.yml"
  workflow_dispatch:

jobs:
  appimage:
    # Oldest LTS we still want the binary to run on decides the glibc floor.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-dev build-essential libfuse2 file \
            libxcb-xinerama0 libxkbcommon-x11-0 libegl1
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[sync,tahoe]" pyinstaller
      - name: Build AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: packaging/build-appimage.sh
      - name: Exit test — clean env joins a local friendnet
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          # Server side from the dev venv (gated: uploads must be paid); the client
          # side uses ONLY the AppImage.
          export LEASEGRID_DEVGRID_DIR=/tmp/ci-grid LEASEGRID_GATED=1
          PATH="$PWD/.venv/bin:$PATH" scripts/dev-grid.sh > /tmp/ci-grid.out 2>&1 &
          for _ in $(seq 1 60); do grep -q "dev-grid up" /tmp/ci-grid.out && break; sleep 1; done
          grep -q "dev-grid up" /tmp/ci-grid.out || { cat /tmp/ci-grid.out; exit 1; }
          FURL="$(grep -o 'pb://[^ ]*' /tmp/ci-grid.out | head -1)"
          APP="$(ls dist/Leasegrid_Sync-*.AppImage)"
          mkdir -p /tmp/ci-home /tmp/ci-sync
          env -i HOME=/tmp/ci-home PATH=/usr/bin:/bin USER=ci QT_QPA_PLATFORM=offscreen \
            LEASEGRID_SYNC_HOME=/tmp/ci-home LEASEGRID_ISSUER_URL=http://127.0.0.1:8700 \
            "$APP" --appimage-extract-and-run --version
          env -i HOME=/tmp/ci-home PATH=/usr/bin:/bin USER=ci QT_QPA_PLATFORM=offscreen \
            LEASEGRID_SYNC_HOME=/tmp/ci-home LEASEGRID_ISSUER_URL=http://127.0.0.1:8700 \
            timeout 180 "$APP" --appimage-extract-and-run --join "$FURL" | tee /tmp/ci-join.out
          grep -q "^Connected" /tmp/ci-join.out
          env -i HOME=/tmp/ci-home PATH=/usr/bin:/bin USER=ci QT_QPA_PLATFORM=offscreen \
            LEASEGRID_SYNC_HOME=/tmp/ci-home LEASEGRID_ISSUER_URL=http://127.0.0.1:8700 \
            timeout 240 "$APP" --appimage-extract-and-run --dogfood-folder /tmp/ci-sync --credit-dogfood --credit-tier medium
          grep -q "leasegrid-sync" /tmp/ci-home/logs/tahoe.log  # bundled tahoe, not a system one
          # Paid: the upload spent tokens on every node.
          for p in 8711 8712 8713; do
            curl -fsS "http://127.0.0.1:$p/v0/info" | grep -q '"spent": [1-9]'
          done
          grep -q "Lease on" /tmp/ci-home/credit-recent.json
          # Short invite code: a second device joins through the grid's local
          # wormhole relay using only the bundled tahoe (wormhole client inside).
          RELAY="$(grep -o 'ws://127.0.0.1:[0-9]*/v1' /tmp/ci-grid.out | head -1)"
          test -n "$RELAY"
          PATH="$PWD/.venv/bin:$PATH" scripts/dev-grid.sh --invite ci-code > /tmp/ci-invite.out 2>&1 &
          for _ in $(seq 1 60); do grep -q "Invite Code" /tmp/ci-invite.out && break; sleep 1; done
          CODE="$(grep -o 'Invite Code for client: .*' /tmp/ci-invite.out | awk '{print $NF}')"
          test -n "$CODE" || { cat /tmp/ci-invite.out; exit 1; }
          mkdir -p /tmp/ci-home2
          env -i HOME=/tmp/ci-home2 PATH=/usr/bin:/bin USER=ci QT_QPA_PLATFORM=offscreen \
            LEASEGRID_SYNC_HOME=/tmp/ci-home2 LEASEGRID_ISSUER_URL=http://127.0.0.1:8700 \
            LEASEGRID_WORMHOLE_SERVER="$RELAY" \
            timeout 180 "$APP" --appimage-extract-and-run --join "$CODE" | tee /tmp/ci-join2.out
          grep -q "^Connected" /tmp/ci-join2.out
          grep -q "^nickname = ci-code" /tmp/ci-home2/tahoe/tahoe.cfg
          grep -q "^shares.needed = 2" /tmp/ci-home2/tahoe/tahoe.cfg
      - uses: actions/upload-artifact@v4
        with:
          name: Leasegrid_Sync-x86_64.AppImage
          path: dist/Leasegrid_Sync-*.AppImage
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Leasegrid_Sync-*.AppImage
          generate_release_notes: true
