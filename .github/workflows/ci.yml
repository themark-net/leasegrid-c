name: CI

on:
  push:
    branches: [main, "lab/**", "feat/**", "cursor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: the ristretto wheel is x86_64-only (see installers.yml)
        os: [ubuntu-latest, macos-15-intel, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-dev build-essential
      - name: Install package + dev tools
        run: |
          python -m pip install -U pip
          # [tahoe] here so the Tahoe 1.20 / pyOpenSSL pins are exercised on every push
          # and tahoe-dependent tests (check-0b local) actually run instead of skipping.
          # netifaces has no cp312 wheels for mac/win: the runner's compiler builds it.
          python -m pip install -e ".[dev,sync,tahoe]"
      - name: Tahoe boots
        run: |
          tahoe --version
          magic-folder --version
          case "$(uname -s)" in MINGW*|MSYS*) T="$(cygpath -m "$RUNNER_TEMP")" ;; *) T="$RUNNER_TEMP" ;; esac
          INTRO="$T/ci-intro"
          tahoe create-introducer --port tcp:45001:interface=127.0.0.1 --location tcp:127.0.0.1:45001 "$INTRO"
          tahoe run --allow-stdin-close "$INTRO" > "$T/ci-intro.log" 2>&1 &
          PID=$!
          for _ in $(seq 1 40); do [ -s "$INTRO/private/introducer.furl" ] && break; sleep 1; done
          kill $PID || true
          test -s "$INTRO/private/introducer.furl" || { cat "$T/ci-intro.log"; exit 1; }
      - name: Ruff
        run: python -m ruff check src tests packaging
      - name: Pytest
        run: python -m pytest -q

  # Semgrep publishes no native Windows wheel. The scan is Linux-only.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: python -m pip install -e ".[lint]"
      # `python -m semgrep` exits 2 on 1.181.0. The pip entry point is `semgrep`.
      - name: Semgrep rule tests
        run: semgrep --test --metrics=off tools/semgrep
      - name: Semgrep scan
        run: semgrep scan --metrics=off --error --config tools/semgrep src scripts packaging
