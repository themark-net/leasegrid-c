[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leasegrid-zkap-lab"
version = "0.1.7"
description = "Leasegrid gate 0b lab ZKAP issuer + storage lease gate (Tahoe 1.20)"
readme = "deploy/zkap-lab/README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Leasegrid" }]
dependencies = [
  "python-challenge-bypass-ristretto>=2022.6.30",
  "cryptography>=41",  # recovery key file (Fernet); [tahoe] caps it at <45
]

[project.scripts]
leasegrid-zkap = "leasegrid_zkap.cli:main"
leasegrid-sync = "leasegrid_sync.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  # 0.17.1 is the version this gate was verified with. S403 is preview-only
  # there; a later ruff can move or drop it and change what CI rejects.
  "ruff==0.17.1",
]
# Semgrep is large and has no Windows wheel. CI installs it only in the
# ubuntu semgrep job; ci-local installs it unless CI_LOCAL_SKIP_SEMGREP=1.
lint = ["semgrep==1.181.0"]
sync = ["PyQt5>=5.15", "segno>=1.6"]
# Tahoe 1.20 + Magic Folder 24.3 in the same venv as the Sync app. The three
# pins below are what keep `tahoe run` booting on a 2026 resolver: Foolscap
# needs pyOpenSSL<25 (X509Req), which caps cryptography<45, which in turn
# caps service-identity<25.
tahoe = [
  "tahoe-lafs==1.20.0",
  "magic-folder==24.3.0",
  "pyOpenSSL<25",
  "cryptography<45",
  "service-identity<25",
  # local magic-wormhole relay for dev-grid `--invite` (short codes offline)
  "magic-wormhole-mailbox-server>=0.5",
  # Py≥3.13 removed stdlib cgi; Tahoe still imports it (AppImage freeze)
  "legacy-cgi>=2.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

# twisted.plugins is listed explicitly (no __init__.py of our own) so the
# storage-plugin dropin lands in site-packages/twisted/plugins on install.
packages = ["leasegrid_zkap", "leasegrid_sync", "twisted.plugins"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Phone read-client sources live under android/ and register a Foolscap
# remote name that Tahoe also registers. Host pytest must not import them.
norecursedirs = ["android", "build", "dist", "*.egg-info", ".*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# preview + explicit codes: S403 is preview-only in ruff 0.17. Prefixes
# (B, and any future S group) stay on stable rules.
preview = true
explicit-preview-rules = true
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "SIM115",
  "PLW1510",
  "S102",
  "S103",
  "S104",
  "S108",
  "S301",
  "S302",
  "S306",
  "S307",
  "S324",
  "S403",
  "S506",
  "S602",
  "S604",
  "S605",
  "S606",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
