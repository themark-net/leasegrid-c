[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leasegrid-zkap-lab"
version = "0.1.0"
description = "Leasegrid lab ZKAP issuer, XMR vid intake (0c), and Tahoe 1.20 lease gate"
readme = "deploy/zkap-lab/README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Leasegrid" }]
dependencies = ["python-challenge-bypass-ristretto>=2022.6.30"]

[project.scripts]
leasegrid-zkap = "leasegrid_zkap.cli:main"

[project.optional-dependencies]
tahoe = ["tahoe-lafs==1.20.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
